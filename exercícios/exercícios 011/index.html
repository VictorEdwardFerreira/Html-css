<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em html 5</title>
</head>
<body>
    <h1>Imagem dinamica</h1>

    <picture>
        <source media="(max-width:750px)" srcset="imagens/b.png" type="image/png">
        <source media="(max-width: 1050px )" srcset="imagens/g.png" type="image/png">
        <img src="imagens/a.png" alt="">
    </picture>

<h1>Reproduzinho áudio</h1>
<p>Vamos aprender a reproduzir áudios em Html5</p>
<audio src="midias/musica.mp3.mp3" controls autoplay></audio>
<!--mp3 WAV ogg-->

<audio>
    <source src="midias/musica.mp3.mp3" type="audio/mpeg">
   
</audio>
</body>
</html>
