<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'arma';
            src: url('ARMY RUST.ttf') format(truetype);
            font-weight: normal;
            font-style: normal;
            /*
            tipos de format ()
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype
            - truetype-aat (Apple Advanced Typography)
            - svg */
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family:'Arma', Times, serif;
        }
    </style>
</head>
<body>
    <h1>Olá mundo</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Sit repellat vel aliquam! Adipisci sequi odio laboriosam impedit accusamus, culpa totam vitae ducimus illum, itaque asperiores nisi mollitia dolor temporibus obcaecati.</p>
</body>
</html>
