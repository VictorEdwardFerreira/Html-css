<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links </title>
    <style>
        /*
        # = ID
        . = CLASS
        : = PSEUDO-CLASS
        : : = PSEUDO-ELEMENT
        > = CLILDREN



        */
        body {
            font-family: Arial, Helvetica, sans-serif;

        }

        a {
            color: rgb(0, 0, 0);
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: brown;
        }
        a:hover {
            color: rgb(255, 0, 157);
            text-decoration: underline;
        }

        a:active {
            color: chocolate;
        }
        a::before {
            content: '» ';
            color: blue;
        }
        a::after {
            content: ' «';
            color: blue;
            
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>

    <ul>
        <li><a href="https://github.com/gustavoguanabara/html-css/tree/master/aulas-pdf">Repositorio GitHub</a></li>
        <li><a href="https://www.youtube.com/@cursoemvideo">Canal do youtube</a></li>
        <li><a href="https://www.cursoemvideo.com/">Site de curso em video</a></li>
    </ul>
</body>
</html>
