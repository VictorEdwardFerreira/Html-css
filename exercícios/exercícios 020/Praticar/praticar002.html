<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        a {
            color: black;
            font-style: italic;
            font-weight: bold;
        }

        a:hover {
            color: blueviolet;
        }

        a:active {
            color: brown;
        }

      a::before {
        content: ' »';
        color: brown;
        font-size: 2em;
        font-style: italic;
      }

      a::after {
        color: brown;
        font-size: 2em;
        font-style: italic; 
      }

      
    </style>
</head>
<body>
    <h1>links</h1>
    
     

    <ul>
        <li><a href="https://www.youtube.com/@rzn_218/featured" target="_blank">Youtube</a></li>
        <li><a href="https://www.tiktok.com/@rzn_142" target="_blank">Tiktok</a></li>
        <li><a href="https://web.whatsapp.com/" target="_blank">Whats</a></li>
    </ul>
</body>
</html>
